name: Check entries
on:
  pull_request:
    paths: ["entries/**", "media/**", "covers/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Zibhelina/etude
          ref: af7b65bf6c54225e712dd05e99661128568d0615 # v2.6.0
          path: .etude
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: .etude
      - name: Validate every entry (decks and types are dry-run imported)
        env:
          ETUDE_HOME: ${{ runner.temp }}/etude-market
        run: node .etude/src/cli/main.ts market index . --check --repo "$GITHUB_REPOSITORY"
