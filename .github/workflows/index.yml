name: Rebuild index
on:
  push:
    branches: [main]
    paths: ["entries/**", "media/**", "covers/**", ".github/workflows/index.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Zibhelina/etude
          ref: af7b65bf6c54225e712dd05e99661128568d0615 # v2.6.0
          path: .etude
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: .etude
      - run: node .etude/src/cli/main.ts market index . --repo "$GITHUB_REPOSITORY"
        env:
          ETUDE_HOME: ${{ runner.temp }}/etude-market
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-index
          path: index.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: index
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: market-index
      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || (git commit -m "Rebuild index" && git push origin HEAD:main)
