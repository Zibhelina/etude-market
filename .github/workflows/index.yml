name: Rebuild index
on:
  push:
    branches: [main]
    paths: ["entries/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Zibhelina/etude
          path: .etude
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: .etude
      - run: node .etude/src/cli/main.ts market index . --repo "$GITHUB_REPOSITORY"
      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || (git commit -m "Rebuild index" && git push)
